<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="140" viewBox="0 0 1440 140">
  <!-- Silhouette d'une cité ouvrière silésienne (familoki, église, chevalements, cheminée).
       Dessin original. Les fenêtres dorées évoquent les lumières des familoki le soir. -->
  <g fill="#1F1B19">
    <rect x="0" y="128" width="1440" height="12"/>
    <!-- familok A -->
    <path d="M0 140V86L75 62L150 86V140Z"/>
    <rect x="30" y="58" width="9" height="16"/>
    <!-- familok B -->
    <path d="M150 140V76H334V140Z"/>
    <rect x="146" y="72" width="192" height="6"/>
    <rect x="172" y="60" width="9" height="13"/><rect x="300" y="60" width="9" height="13"/>
    <!-- église à dôme -->
    <path d="M350 140V84H470V140Z"/>
    <path d="M346 86L410 64L474 86Z"/>
    <rect x="394" y="42" width="32" height="44"/>
    <path d="M390 44Q410 12 430 44Z"/>
    <rect x="407" y="8" width="6" height="12"/>
    <!-- arbres -->
    <circle cx="498" cy="112" r="18"/><circle cx="526" cy="118" r="14"/>
    <!-- chevalement (szyb) et bâtiment de la machine d'extraction -->
    <path d="M590 140V104L640 86L690 104V140Z"/>
    <g fill="none" stroke="#1F1B19" stroke-width="6">
      <path d="M618 30V128M652 30V128"/>
      <path d="M618 50L652 74M652 50L618 74M618 82L652 106M652 82L618 106"/>
      <path d="M652 34L706 128" stroke-width="7"/>
      <circle cx="626" cy="20" r="11" stroke-width="4"/>
      <circle cx="646" cy="20" r="11" stroke-width="4"/>
    </g>
    <rect x="610" y="26" width="50" height="8"/>
    <!-- cheminée -->
    <path d="M736 140L742 18H757L763 140Z"/>
    <rect x="739" y="30" width="21" height="5"/>
    <!-- halles en dents de scie -->
    <path d="M770 140V92L800 72V92L830 72V92L860 72V92L890 72V92L920 72V92L950 72V140Z"/>
    <!-- familok C -->
    <path d="M985 140V88L1080 64L1175 88V140Z"/>
    <rect x="1010" y="60" width="9" height="18"/><rect x="1140" y="60" width="9" height="18"/>
    <!-- second chevalement -->
    <g fill="none" stroke="#1F1B19" stroke-width="5">
      <path d="M1222 52V128M1248 52V128M1222 70L1248 90M1248 70L1222 90"/>
      <path d="M1248 56L1286 128" stroke-width="6"/>
      <circle cx="1235" cy="44" r="9" stroke-width="3.5"/>
    </g>
    <rect x="1216" y="48" width="38" height="7"/>
    <!-- familok D -->
    <path d="M1296 140V80H1440V140Z"/>
    <rect x="1292" y="76" width="152" height="6"/>
    <rect x="1320" y="64" width="9" height="13"/><rect x="1400" y="64" width="9" height="13"/>
  </g>
  <!-- fenêtres éclairées -->
  <g fill="#C79A32" fill-opacity=".55">
    <rect x="22" y="98" width="8" height="12" rx="4"/><rect x="50" y="98" width="8" height="12" rx="4"/><rect x="92" y="98" width="8" height="12" rx="4"/><rect x="120" y="98" width="8" height="12" rx="4"/>
    <rect x="36" y="114" width="8" height="11" rx="4"/><rect x="106" y="114" width="8" height="11" rx="4"/>
    <rect x="168" y="90" width="8" height="12" rx="4"/><rect x="196" y="90" width="8" height="12" rx="4"/><rect x="250" y="90" width="8" height="12" rx="4"/><rect x="306" y="90" width="8" height="12" rx="4"/>
    <rect x="224" y="110" width="8" height="12" rx="4"/><rect x="278" y="110" width="8" height="12" rx="4"/>
    <rect x="404" y="54" width="12" height="16" rx="6"/>
    <rect x="368" y="100" width="9" height="16" rx="4.5"/><rect x="443" y="100" width="9" height="16" rx="4.5"/>
    <rect x="606" y="112" width="8" height="10" rx="4"/><rect x="666" y="112" width="8" height="10" rx="4"/>
    <rect x="806" y="102" width="10" height="14" rx="5"/><rect x="866" y="102" width="10" height="14" rx="5"/><rect x="926" y="102" width="10" height="14" rx="5"/>
    <rect x="1010" y="98" width="8" height="12" rx="4"/><rect x="1040" y="98" width="8" height="12" rx="4"/><rect x="1112" y="98" width="8" height="12" rx="4"/><rect x="1142" y="98" width="8" height="12" rx="4"/>
    <rect x="1076" y="112" width="8" height="12" rx="4"/>
    <rect x="1314" y="94" width="8" height="12" rx="4"/><rect x="1346" y="94" width="8" height="12" rx="4"/><rect x="1410" y="94" width="8" height="12" rx="4"/>
    <rect x="1378" y="112" width="8" height="12" rx="4"/>
  </g>
</svg>
